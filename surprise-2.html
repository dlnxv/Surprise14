<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Un jour comme celui-là 🇱🇰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF7F1;
    --cream-deep:#FBEDE3;
    --berry:#A63A50;
    --berry-soft:#C97B84;
    --mint:#6FAE9A;
    --ink:#3A2E2E;
    --gold:#D9A441;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:radial-gradient(circle at 20% 10%, var(--cream-deep), var(--cream) 60%);
    font-family:'Quicksand', sans-serif;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .stage{
    width:100%;
    max-width:440px;
    text-align:center;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.6rem;
    color:var(--berry);
    margin:0 0 6px;
    line-height:1.3;
  }
  p.sub{
    font-size:.98rem;
    color:#6b5a5a;
    margin:0 0 28px;
  }
  .photo-frame{
    position:relative;
    width:100%;
    max-width:340px;
    margin:0 auto;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 16px 36px rgba(0,0,0,.18);
    background:#000;
  }
  .photo-frame img{
    display:block;
    width:100%;
    height:auto;
    filter:blur(24px) brightness(0.85) saturate(1.1);
    transform:scale(1.08);
    transition:filter 2.6s ease, transform 2.6s ease;
  }
  .photo-frame.revealed img{
    filter:blur(0px) brightness(1) saturate(1);
    transform:scale(1);
  }
  .date-tag{
    display:inline-block;
    margin-top:22px;
    padding:6px 18px;
    border-radius:50px;
    background:var(--berry);
    color:#fff;
    font-size:.85rem;
    font-weight:700;
    letter-spacing:.04em;
    opacity:0;
    transition:opacity .8s ease;
  }
  .date-tag.show{opacity:1;}
  .quote{
    margin-top:20px;
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:1.15rem;
    line-height:1.6;
    color:var(--ink);
    opacity:0;
    transform:translateY(10px);
    transition:opacity 1s ease, transform 1s ease;
  }
  .quote.show{
    opacity:1;
    transform:translateY(0);
  }
  .tap-hint{
    margin-top:24px;
    font-size:.85rem;
    color:var(--berry-soft);
    font-weight:600;
  }
</style>
</head>
<body>
