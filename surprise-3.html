<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nos jours en Albanie 🇦🇱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF7F1;
    --cream-deep:#FBEDE3;
    --berry:#A63A50;
    --berry-soft:#C97B84;
    --mint:#6FAE9A;
    --ink:#3A2E2E;
    --gold:#D9A441;
    --wax:#8C2F3E;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:radial-gradient(circle at 20% 10%, var(--cream-deep), var(--cream) 60%);
    font-family:'Quicksand', sans-serif;
    color:var(--ink);
    overflow:hidden;
  }
  .stage{
    position:relative;
    width:100%;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.5rem;
    color:var(--berry);
    margin:0 0 6px;
    line-height:1.3;
    position:absolute;
    top:6%;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
    width:90%;
    z-index:3;
  }
  .sub{
    position:absolute;
    top:13.5%;
    left:50%;
    transform:translateX(-50%);
    font-size:.92rem;
    color:#6b5a5a;
    z-index:3;
    text-align:center;
    width:90%;
    transition:opacity .4s ease;
  }

  /* --- Enveloppe centrale --- */
  .envelope-wrap{
    position:relative;
    width:220px;
    height:150px;
    cursor:pointer;
    z-index:4;
    transition:opacity .5s ease, transform .5s ease;
  }
  .envelope-wrap.hide{
    opacity:0;
    transform:scale(0.7);
    pointer-events:none;
  }
  .envelope-body{
    position:absolute;
    inset:0;
    background:linear-gradient(160deg, #fffdfa, var(--cream-deep));
    border-radius:10px;
    box-shadow:0 14px 30px rgba(0,0,0,.15);
  }
  .flap{
    position:absolute;
    top:0; left:0;
    width:100%;
    height:0;
    border-style:solid;
    border-width:78px 110px 0 110px;
    border-color:var(--berry-soft) transparent transparent transparent;
    transform-origin:top center;
    transition:transform .6s cubic-bezier(.4,0,.2,1);
    z-index:5;
  }
  .envelope-wrap.opened .flap{
    transform:rotateX(180deg);
  }
  .wax-seal{
    position:absolute;
    top:52px;
    left:50%;
    transform:translateX(-50%);
    width:40px;
    height:40px;
    background:radial-gradient(circle at 35% 30%, #b23a4d, var(--wax));
    border-radius:50%;
    box-shadow:0 4px 8px rgba(0,0,0,.25);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#f4d9b0;
    font-size:1rem;
    font-family:'Fraunces', serif;
    z-index:6;
    transition:opacity .3s ease, transform .3s ease;
  }
  .envelope-wrap.opened .wax-seal{
    opacity:0;
    transform:translateX(-50%) scale(0.4) rotate(25deg);
  }

  /* --- Photos flottantes --- */
  .photo{
    position:absolute;
    width:150px;
    border-radius:10px;
    box-shadow:0 12px 26px rgba(0,0,0,.22);
    border:5px solid #fff;
    opacity:0;
    z-index:2;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%) scale(0.3) rotate(0deg);
    transition:transform 1.1s cubic-bezier(.34,1.4,.44,1), opacity .6s ease;
  }
  .photo img{
    display:block;
    width:100%;
    height:auto;
    border-radius:5px;
  }
  .photo.p1, .photo.p2{ width:225px; }
  .photo.fly{ opacity:1; }
  .photo.p1.fly{ transform:translate(-125%,-140%) rotate(-8deg) scale(1); }
  .photo.p2.fly{ transform:translate(25%,-140%) rotate(6deg) scale(1); }
  .photo.p3.fly{ transform:translate(-175%,60%) rotate(5deg) scale(1); }
  .photo.p4.fly{ transform:translate(75%,60%) rotate(-6deg) scale(1); }

  .quote{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    max-width:230px;
    text-align:center;
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:1.12rem;
    line-height:1.55;
    color:var(--ink);
    opacity:0;
    z-index:3;
    transition:opacity 1s ease;
  }
  .quote.show{ opacity:1; }

  @media (max-width:420px){
    .photo{ width:112px; }
    .photo.p1, .photo.p2{ width:165px; }
    .photo.p1.fly{ transform:translate(-115%,-150%) rotate(-8deg) scale(1); }
    .photo.p2.fly{ transform:translate(15%,-150%) rotate(6deg) scale(1); }
    .photo.p3.fly{ transform:translate(-140%,68%) rotate(5deg) scale(1); }
    .photo.p4.fly{ transform:translate(40%,68%) rotate(-6deg) scale(1); }
    .envelope-wrap{ width:180px; height:124px; }
    .flap{ border-width:64px 90px 0 90px; }
    .wax-seal{ top:42px; width:34px; height:34px; }
  }
</style>
</head>

  <p class="quote" id="quoteText">Des jours comme ceux-là,<br>j'en veux encore plein d'autres avec toi.</p>
</div>

<script>
  const envelope = document.getElementById('envelope');
  const subText = document.getElementById('subText');
  const quoteText = document.getElementById('quoteText');
  const photos = ['p1','p2','p3','p4'].map(id => document.getElementById(id));
  let opened = false;

  envelope.addEventListener('click', function(){
    if(opened) return;
    opened = true;
    envelope.classList.add('opened');
    subText.style.opacity = 0;

    setTimeout(() => {
      envelope.classList.add('hide');
      photos.forEach((p, i) => {
        setTimeout(() => p.classList.add('fly'), i * 180);
      });
      setTimeout(() => quoteText.classList.add('show'), 900);
    }, 550);
  });
</script>
