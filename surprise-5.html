<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presque... 🤍</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF7F1;
    --cream-deep:#FBEDE3;
    --berry:#A63A50;
    --berry-soft:#C97B84;
    --mint:#6FAE9A;
    --ink:#3A2E2E;
    --gold:#D9A441;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:radial-gradient(circle at 20% 10%, var(--cream-deep), var(--cream) 60%);
    font-family:'Quicksand', sans-serif;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    overflow:hidden;
  }
  .stage{
    width:100%;
    max-width:420px;
    text-align:center;
    position:relative;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.7rem;
    color:var(--berry);
    margin:0 0 8px;
    line-height:1.3;
  }
  p.sub{
    font-size:.98rem;
    color:#6b5a5a;
    margin:0 0 34px;
    transition:opacity .4s ease;
  }

  /* --- Coeur pulsant a cliquer --- */
  .heart-zone{
    position:relative;
    height:140px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .heart-btn{
    width:86px;
    height:86px;
    border:none;
    background:none;
    cursor:pointer;
    font-size:3.6rem;
    line-height:1;
    animation:pulse 1.6s ease-in-out infinite;
    filter:drop-shadow(0 8px 14px rgba(166,58,80,.3));
    transition:opacity .4s ease, transform .4s ease;
  }
  @keyframes pulse{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.12); }
  }
  .heart-zone.opened .heart-btn{
    opacity:0;
    transform:scale(0.4);
    pointer-events:none;
    animation:none;
  }

  /* --- Petits coeurs qui s'envolent --- */
  .float-heart{
    position:absolute;
    bottom:60px;
    left:50%;
    font-size:1.3rem;
    opacity:0;
    pointer-events:none;
  }
  .float-heart.go{
    animation:floatUp 1.6s ease-out forwards;
  }
  @keyframes floatUp{
    0%{ opacity:0; transform:translate(-50%,0) scale(0.6); }
    15%{ opacity:1; }
    100%{ opacity:0; transform:translate(var(--dx,-40px),-140px) scale(1); }
  }

  /* --- Message final --- */
  .message{
    margin-top:12px;
    opacity:0;
    transform:translateY(12px);
    transition:opacity 1s ease, transform 1s ease;
  }
  .message.show{
    opacity:1;
    transform:translateY(0);
  }
  .message p{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:1.18rem;
    line-height:1.7;
    color:var(--ink);
    margin:0 0 6px;
  }
  .message .signature{
    margin-top:16px;
    font-weight:600;
    font-style:normal;
    font-family:'Quicksand', sans-serif;
    color:var(--berry-soft);
  }
  .badge{
    display:inline-block;
    margin-top:22px;
    padding:8px 20px;
    border-radius:50px;
    background:var(--mint);
    color:#fff;
    font-size:.85rem;
    font-weight:700;
    letter-spacing:.03em;
    opacity:0;
    transition:opacity .8s ease;
  }
  .badge.show{ opacity:1; }
</style>
</head>
<body>

<div class="stage">
  <h1 id="titleText">On y est presque 🤍</h1>
  <p class="sub" id="subText">Clique sur le cœur</p>

  <div class="heart-zone" id="heartZone">
    <button class="heart-btn" id="heartBtn">❤️</button>
  </div>

  <div class="message" id="message">
    <p>Cette fois-ci, c'est la bonne.</p>
    <p>Rejoins-moi le <strong>2 septembre à 19h30</strong></p>
    <p>au <strong>3 villa Dietz Monnin, Paris 16e</strong>.</p>
    <p class="signature">Je t'attends 🤍</p>
  </div>

  <div class="badge" id="badge">À DEMAIN MON AMOUR</div>
</div>

<script>
  const heartBtn = document.getElementById('heartBtn');
  const heartZone = document.getElementById('heartZone');
  const subText = document.getElementById('subText');
  const titleText = document.getElementById('titleText');
  const message = document.getElementById('message');
  const badge = document.getElementById('badge');
  const stage = document.querySelector('.stage');
  let opened = false;

  function spawnHearts(){
    const symbols = ['❤️','🤍','✨'];
    for(let i=0;i<10;i++){
      const h = document.createElement('div');
      h.className = 'float-heart';
      h.textContent = symbols[Math.floor(Math.random()*symbols.length)];
      const dx = (Math.random()-0.5) * 160;
      h.style.setProperty('--dx', dx + 'px');
      h.style.left = (46 + Math.random()*8) + '%';
      h.style.animationDelay = (Math.random()*0.4) + 's';
      stage.appendChild(h);
      requestAnimationFrame(() => h.classList.add('go'));
      setTimeout(() => h.remove(), 2200);
    }
  }

  heartBtn.addEventListener('click', function(){
    if(opened) return;
    opened = true;
    spawnHearts();
    heartZone.classList.add('opened');
    subText.style.opacity = 0;
    titleText.textContent = 'Pour toi 🤍';

    setTimeout(() => {
      message.classList.add('show');
    }, 500);
    setTimeout(() => {
      badge.classList.add('show');
    }, 1300);
  });
</script>

</body>
</html>
